services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # PostgreSQL доступен только другим контейнерам.
    # Не публикуем 5432 на host.
    # expose:
    #   - "5432"
    ports:
      - '5432:5432'

    networks:
      - backend

    # Не даём PostgreSQL неограниченно потреблять память/CPU.
    # Значения нужно адаптировать под конкретный сервер.
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - '16686:16686' # Интерфейс Jaeger (UI)
      - '4318:4318' # OTLP HTTP receiver (сюда NestJS будет слать трейсы)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - '6379:6379'
    restart: unless-stopped
    environment:
      REDIS_USERNAME: myuser
      REDIS_PASSWORD: asdasas

volumes:
  postgres_data:
    name: expense_splitter_postgres_data

networks:
  backend:
    driver: bridge
